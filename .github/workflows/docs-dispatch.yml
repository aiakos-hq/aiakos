name: docs-dispatch

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild aiakos.dev docs
        env:
          GH_TOKEN: ${{ secrets.AIAKOS_DEV_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/aiakos-hq/aiakos.dev/dispatches \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --field event_type=docs-updated
