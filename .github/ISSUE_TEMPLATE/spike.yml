name: Spike
description: A time-boxed experiment to answer a design question
labels: ["type/spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do we need to know, and which decision depends on it?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: What will be tried, in what environment.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The evidence that answers the question. Findings go to docs/spikes/NNNN-*.md.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: "e.g. 1 day"
