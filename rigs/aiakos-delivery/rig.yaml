# The rig that builds Aiakos while Aiakos cannot run its own team (see docs/workflow.md).
# Start it from the repository root in WSL:  rig up rigs/aiakos-delivery/rig.yaml
#
# Models, in one place. Change a seat's model on its `model:` line below.
#   lead       claude-sonnet-5-5       runs scripts; needs no strong model
#   author     gpt-6.1-sol             briefs and acceptance tests
#   author2    gpt-6.1-sol             a second author, so two slices can be analysed at once
#   architect  claude-opus-5-5         checks the analysis
#   impl       gpt-6-luna              the default implementer (Sonnet level)
#   senior     gpt-6.1-sol             escalated stories only
#   qa         opencode-go/gpt-6-luna  third vendor; runs the gate
#   reviewer   claude-opus-5-5         reads the diff once
version: "0.2"
name: aiakos-delivery
summary: >
  Delivery team for Aiakos. Codex writes briefs and implements, Claude checks and reviews,
  Pi on OpenCode Go runs the acceptance gate. The maintainer approves briefs and merges.

culture_file: CULTURE.md

# The repository tracks CLAUDE.md, so OpenRig's blocks go to the git-ignored local file.
managed_blocks:
  claude-code: CLAUDE.local.md

# Seats push and open pull requests without asking. Merging is prevented by branch protection.
permission_policy: builtin:open

docs:
  - path: SETUP.md

pods:
  - id: lead
    label: Lead
    members:
      - id: lead
        agent_ref: "local:agents/lead"
        profile: default
        runtime: claude-code
        model: claude-sonnet-5-5
        cwd: "../.."
    edges: []

  - id: analysis
    label: Analysis
    members:
      - id: author
        agent_ref: "local:agents/author"
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        cwd: "../.."
      - id: author2
        agent_ref: "local:agents/author"
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        cwd: "../.."
      - id: architect
        agent_ref: "local:agents/architect"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "../.."
    edges:
      - kind: delegates_to
        from: author
        to: architect
      - kind: delegates_to
        from: author2
        to: architect

  - id: build
    label: Build
    members:
      - id: impl
        agent_ref: "local:agents/impl"
        profile: default
        runtime: codex
        model: gpt-6-luna
        cwd: "../.."
      - id: senior
        agent_ref: "local:agents/impl"
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        cwd: "../.."
    edges: []

  - id: verify
    label: Verify
    members:
      - id: qa
        agent_ref: "local:agents/qa"
        profile: default
        runtime: pi
        model: opencode-go/gpt-6-luna
        cwd: "../.."
      - id: reviewer
        agent_ref: "local:agents/reviewer"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        cwd: "../.."
    edges:
      - kind: delegates_to
        from: qa
        to: reviewer

edges:
  - kind: delegates_to
    from: lead.lead
    to: analysis.author
  - kind: delegates_to
    from: lead.lead
    to: analysis.author2
  - kind: delegates_to
    from: lead.lead
    to: build.impl
  - kind: delegates_to
    from: lead.lead
    to: build.senior
  - kind: delegates_to
    from: build.impl
    to: verify.qa
  - kind: delegates_to
    from: build.senior
    to: verify.qa
  - kind: can_observe
    from: verify.reviewer
    to: build.impl
