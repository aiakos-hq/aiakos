# The rig that builds Aiakos while Aiakos cannot run its own team (see docs/workflow.md).
# Start it from the repository root in WSL:  rig up rigs/aiakos-delivery/rig.yaml
#
# Models, in one place. Change a seat's model on its `model:` line below.
#   desk   lead         claude-sonnet-5-5   the maintainer's console; receives nothing by itself
#   desk   router       claude-haiku-5-5    receives every report and makes the next move
#   desk   board        (no model)          a terminal that runs board.sh
#   team   architect    claude-opus-5-5     checks the analysis; takes escalations
#   team   reviewer     claude-opus-5-5     reads the diff once
#   team   gate         claude-haiku-5-5    runs the baseline and the gate (a script decides)
#   team   low1 low2    gpt-6-luna          Codex Pool Low: implement stories, write acceptance
#                                           tests
#   team   high1 high2  gpt-6.1-sol         Codex Pool High: brief and split, escalated stories,
#                                           chores and bugs
#
# A seat of a pool has no role of its own: each item names the role file to read
# (rigs/aiakos-delivery/roles/). `tools/story.sh hand` picks the seat and clears its
# conversation before it delivers the item. Every start of the rig begins with empty
# conversations (restore_policy: relaunch_fresh).
version: "0.2"
name: aiakos-delivery
summary: >
  Delivery team for Aiakos. Codex writes briefs and implements, Claude checks and reviews,
  and a seat runs the acceptance gate, which is a script. The maintainer approves briefs and
  merges.

culture_file: CULTURE.md

# The repository tracks CLAUDE.md, so OpenRig's blocks go to the git-ignored local file.
managed_blocks:
  claude-code: CLAUDE.local.md

# Seats push and open pull requests without asking. Merging is prevented by branch protection.
permission_policy: builtin:open

docs:
  - path: SETUP.md

pods:
  # What the maintainer looks at.
  - id: desk
    label: Desk
    members:
      - id: lead
        agent_ref: "local:agents/lead"
        profile: default
        runtime: claude-code
        model: claude-sonnet-5-5
        permission_policy: builtin:auto
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: router
        agent_ref: "local:agents/router"
        profile: default
        runtime: claude-code
        model: claude-haiku-5-5
        effort: high
        permission_policy: builtin:auto
        restore_policy: relaunch_fresh
        cwd: "../.."
      # Not an agent: a terminal that runs board.sh. It shows what waits for the maintainer and
      # tells the router what changed on GitHub.
      - id: board
        agent_ref: "builtin:terminal"
        profile: none
        runtime: terminal
        cwd: "../.."
        startup:
          actions:
            - type: send_text
              value: bash rigs/aiakos-delivery/board.sh
              phase: after_ready
              idempotent: true
    edges:
      - kind: delegates_to
        from: lead
        to: router

  # The seats that do the work. Nobody has to watch them one by one.
  - id: team
    label: Team
    members:
      - id: architect
        agent_ref: "local:agents/architect"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        permission_policy: builtin:auto
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: reviewer
        agent_ref: "local:agents/reviewer"
        profile: default
        runtime: claude-code
        model: claude-opus-5-5
        permission_policy: builtin:auto
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: gate
        agent_ref: "local:agents/gate"
        profile: default
        runtime: claude-code
        model: claude-haiku-5-5
        effort: high
        permission_policy: builtin:auto
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: low1
        agent_ref: "local:agents/worker"
        profile: default
        runtime: codex
        model: gpt-6-luna
        permission_policy: builtin:yolo
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: low2
        agent_ref: "local:agents/worker"
        profile: default
        runtime: codex
        model: gpt-6-luna
        permission_policy: builtin:yolo
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: high1
        agent_ref: "local:agents/worker"
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        permission_policy: builtin:yolo
        restore_policy: relaunch_fresh
        cwd: "../.."
      - id: high2
        agent_ref: "local:agents/worker"
        profile: default
        runtime: codex
        model: gpt-6.1-sol
        permission_policy: builtin:yolo
        restore_policy: relaunch_fresh
        cwd: "../.."
    edges:
      - kind: delegates_to
        from: gate
        to: reviewer

edges:
  - kind: delegates_to
    from: desk.router
    to: team.architect
  - kind: delegates_to
    from: desk.router
    to: team.reviewer
  - kind: delegates_to
    from: desk.router
    to: team.gate
  - kind: delegates_to
    from: desk.router
    to: team.low1
  - kind: delegates_to
    from: desk.router
    to: team.low2
  - kind: delegates_to
    from: desk.router
    to: team.high1
  - kind: delegates_to
    from: desk.router
    to: team.high2
