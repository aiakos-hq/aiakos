name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Report SDK version
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      # Postgres for the database tests comes from Testcontainers, using the runner's Docker.
      - name: Test
        run: dotnet test -c Release --no-build --results-directory artifacts/test-results --report-trx

      - name: Publish node (linux-x64, self-contained)
        run: dotnet publish src/Aiakos.Node -c Release -r linux-x64 --self-contained -o artifacts/node/linux-x64

      - name: Pack placeholder tool
        run: dotnet pack src/Aiakos.Cli -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/test-results

  # Contract checks for the orchestrator <-> node proto (spec 0002 AC1/AC2, ADR 0021).
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true

      - name: Lint
        run: buf lint

      # Skipped while main has no buf.yaml (the pull request that adds it).
      - name: Breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main
          if git cat-file -e main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=main'
          else
            echo "::notice::main has no buf.yaml yet; buf breaking skipped"
          fi
