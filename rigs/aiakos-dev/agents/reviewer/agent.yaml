apiVersion: aiakos.dev/v1
kind: Agent
name: reviewer
description: Reviews a PR's exact diff against its spec, acceptance criteria and the definition of done.
defaults:
  harness: claude-code
  model: opus
guidance:
  - GUIDANCE.md
skills:
  - skills/review-pr
harnesses:
  claude-code:
    permission_mode: default
    permissions:
      allow:
        - "Bash(gh pr view:*)"
        - "Bash(gh pr diff:*)"
        - "Bash(gh pr checkout:*)"
        - "Bash(gh pr checks:*)"
        - "Bash(gh pr review:*)"
        - "Bash(gh issue view:*)"
        - "Bash(gh run view:*)"
        - "Bash(git status:*)"
        - "Bash(git diff:*)"
        - "Bash(git log:*)"
        - "Bash(git show:*)"
        - "Bash(git fetch:*)"
        - "Bash(git rev-parse:*)"
        - "Bash(dotnet build:*)"
        - "Bash(dotnet test:*)"
        - "Bash(dotnet format --verify-no-changes:*)"
      deny:
        - "Bash(tmux:*)"
        - "Bash(aiakos:*)"
        - "Bash(dotnet aiakos:*)"
        - "Bash(dotnet tool:*)"
        - "Bash(cmd.exe:*)"
        - "Bash(powershell.exe:*)"
        - "Bash(pwsh.exe:*)"
        - "Bash(wsl.exe:*)"
        - "Bash(kill:*)"
        - "Bash(pkill:*)"
        - "Bash(killall:*)"
        - "Bash(git push --force:*)"
        - "Bash(git push -f:*)"
        - "Bash(git push --force-with-lease:*)"
        - "Bash(git push origin main:*)"
        - "Bash(git push origin HEAD:main:*)"
        - "Bash(gh pr merge:*)"
        - "Bash(gh api:*)"
        - "Bash(gh auth:*)"
        - "Bash(gh secret:*)"
        - "Bash(gh release:*)"
        - "Bash(gh workflow:*)"
        - "Bash(gh repo:*)"
        - "Read(//mnt/**)"
        - "Edit(//mnt/**)"
        - "Read(~/.aiakos*/**)"
        - "Edit(~/.aiakos*/**)"
        - "Read(~/aiakos/seats/*/*/aiakos/**)"
        - "Edit(~/aiakos/seats/*/*/aiakos/**)"
        - "Edit"
        - "Write"
        - "NotebookEdit"
        - "Bash(git commit:*)"
        - "Bash(git push:*)"
        - "Bash(gh pr create:*)"
        - "Bash(gh pr comment:*)"
        - "Bash(gh pr review --approve:*)"
        - "Bash(gh pr review --request-changes:*)"
        - "Bash(gh pr review -a:*)"
        - "Bash(gh pr review -r:*)"
